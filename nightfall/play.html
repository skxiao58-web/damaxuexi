<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightfall Strike Play</title>
  <link rel="stylesheet" href="nightfall.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="shade"></div>
    <section id="menu">
      <div class="eyebrow">NIGHTFALL STRIKE</div>
      <h1>夜间突袭<span>30 秒连续行动</span></h1>
      <p>废墟街道推进 · 掩体交火 · 爆炸与直升机掠过。点击开始；空格切换第一人称；Esc 暂停。</p>
      <button id="start" disabled>加载中…</button>
      <div class="instructions">鼠标移动瞄准 · 按住射击 · 命中前方敌方单位计分</div>
      <div class="sound">首次开始会开启环境音效（可在系统里静音）</div>
    </section>
    <section id="pause" hidden>
      <h2>已暂停</h2>
      <p>按 Esc 或点击继续</p>
      <button id="resume">继续</button>
      <button id="restart" class="secondary">重新开始</button>
    </section>
    <section id="end" hidden>
      <div class="eyebrow">MISSION COMPLETE</div>
      <h2>行动结束</h2>
      <p id="result">30 秒行动完成</p>
      <button id="replay">再来一次</button>
    </section>
    <div id="error" hidden></div>
  </div>
  <script>
  function fail(msg) {
    var b = document.getElementById("start");
    var e = document.getElementById("error");
    if (b) { b.disabled = true; b.textContent = "加载失败"; }
    if (e) { e.hidden = false; e.textContent = msg; }
  }
  var t = setTimeout(function(){ fail("还在加载或已失败。请用 Chrome 打开本页，或再等几秒。"); }, 20000);
  window.__clearNightfallLoadWatch = function(){ clearTimeout(t); };
  window.__showNightfallFail = fail;
  </script>
  <script type="module">
  import("./nightfall-main.js").then(function(){
    window.__clearNightfallLoadWatch && window.__clearNightfallLoadWatch();
  }).catch(function(err){
    console.error(err);
    window.__showNightfallFail("模块失败: " + (err && err.message ? err.message : err));
  });
  </script>
</body>
</html>
