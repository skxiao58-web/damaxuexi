<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电影级序列 Demo · damaxuexi</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      color: rgba(220, 228, 236, 0.85);
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(8, 12, 18, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="hint">电影序列 Demo · 自动播放约 30 秒</div>

  <script>
    (function bootThree() {
      function start() {
        try { runDemo(); } catch (err) {
          console.error(err);
          document.getElementById('hint').textContent = 'Demo 启动失败，请刷新重试';
        }
      }

      function loadScript(src, onOk, onFail) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = onOk;
        s.onerror = onFail;
        document.head.appendChild(s);
      }

      // Prefer local r128, then cdnjs r128 (classic scripts, no ES modules)
      loadScript('./nightfall-rework/three.min.js', function () {
        if (window.THREE) start();
        else loadFallback();
      }, loadFallback);

      function loadFallback() {
        loadScript(
          'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
          start,
          function () {
            document.getElementById('hint').textContent = 'Three.js 加载失败';
          }
        );
      }
    })();

    function runDemo() {
      var THREE = window.THREE;

      // --- Scene / camera / renderer ---
      var scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.03);

      var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.7, 5);

      var renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      if ('outputEncoding' in renderer && THREE.sRGBEncoding !== undefined) {
        renderer.outputEncoding = THREE.sRGBEncoding;
      }
      document.body.appendChild(renderer.domElement);

      // Click does nothing critical (no PointerLock)
      document.body.addEventListener('click', function () {});

      // --- Lights ---
      var hemiLight = new THREE.HemisphereLight(0x222233, 0x000000, 0.6);
      scene.add(hemiLight);

      var dirLight = new THREE.DirectionalLight(0xffaa88, 1.2);
      dirLight.position.set(10, 20, -10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // --- Ground ---
      var groundGeo = new THREE.PlaneGeometry(200, 200);
      var groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1, metalness: 0 });
      var ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // --- Buildings ---
      function createBuilding(x, z, w, h, d) {
        var geo = new THREE.BoxGeometry(w, h, d);
        var mat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.1 });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, h / 2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }

      for (var i = 0; i < 15; i++) {
        var bx = (Math.random() - 0.5) * 80;
        var bz = -Math.random() * 120 - 10;
        var bw = 6 + Math.random() * 8;
        var bh = 6 + Math.random() * 12;
        var bd = 6 + Math.random() * 8;
        createBuilding(bx, bz, bw, bh, bd);
      }

      // --- Barrier ---
      var barrierGeo = new THREE.BoxGeometry(4, 2, 1.5);
      var barrierMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
      var barrier = new THREE.Mesh(barrierGeo, barrierMat);
      barrier.position.set(0, 1, -20);
      barrier.castShadow = true;
      barrier.receiveShadow = true;
      scene.add(barrier);

      // --- Vehicles ---
      function createVehicle(x, z) {
        var bodyMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 });
        var body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 2), bodyMat);
        body.position.set(x, 0.75, z);
        body.castShadow = true;
        scene.add(body);
        var top = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1.5), bodyMat);
        top.position.set(x, 1.5, z);
        top.castShadow = true;
        scene.add(top);
      }
      createVehicle(-6, -30);
      createVehicle(8, -40);

      // --- Soldier (CapsuleGeometry fallback for r128) ---
      function makeBodyGeometry() {
        if (typeof THREE.CapsuleGeometry === 'function') {
          return new THREE.CapsuleGeometry(0.4, 1.2, 8, 16);
        }
        return new THREE.CylinderGeometry(0.4, 0.4, 1.2, 12);
      }

      function createSoldier() {
        var soldierGroup = new THREE.Group();
        var bodyMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
        var bodyMesh = new THREE.Mesh(makeBodyGeometry(), bodyMat);
        bodyMesh.castShadow = true;
        soldierGroup.add(bodyMesh);

        var headMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.3, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x777777 })
        );
        headMesh.position.set(0, 1.1, 0);
        headMesh.castShadow = true;
        soldierGroup.add(headMesh);

        var gunMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.15, 0.15),
          new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5, roughness: 0.4 })
        );
        gunMesh.position.set(0.5, 0.4, 0.2);
        soldierGroup.add(gunMesh);
        return soldierGroup;
      }

      var soldierGroup = createSoldier();
      soldierGroup.position.set(0, 1, 5);
      scene.add(soldierGroup);

      // Squad clones
      var squad = [];
      for (var si = 0; si < 3; si++) {
        var g = createSoldier();
        g.position.set((si - 1) * 1.5, 1, 7 + si * 0.5);
        scene.add(g);
        squad.push(g);
      }

      // --- Helicopter with tagged rotor ---
      var heliGroup = new THREE.Group();
      var heliBody = new THREE.Mesh(
        new THREE.BoxGeometry(3, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.4 })
      );
      heliGroup.add(heliBody);

      var rotor = new THREE.Mesh(
        new THREE.BoxGeometry(6, 0.1, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      rotor.position.set(0, 0.7, 0);
      rotor.userData.isRotor = true;
      heliGroup.add(rotor);

      heliGroup.position.set(-20, 15, -40);
      scene.add(heliGroup);

      // --- Smoke ---
      var smokeParticles = [];
      var smokeGeo = new THREE.SphereGeometry(0.6, 8, 8);
      var smokeMat = new THREE.MeshStandardMaterial({
        color: 0x555555,
        transparent: true,
        opacity: 0.4
      });

      function spawnSmoke(x, y, z) {
        var s = new THREE.Mesh(smokeGeo, smokeMat.clone());
        s.position.set(x, y, z);
        s.material.opacity = 0.0;
        scene.add(s);
        smokeParticles.push({ mesh: s, life: 0 });
      }

      var explosionLight = new THREE.PointLight(0xffaa33, 0, 30);
      explosionLight.position.set(0, 3, -40);
      scene.add(explosionLight);

      // --- Audio: soft-fail, never block scene (skip broken jsdelivr URLs) ---
      var playExplosionSound = function () {};
      try {
        var listener = new THREE.AudioListener();
        camera.add(listener);
        var explosionSound = new THREE.Audio(listener);
        // Do not load unreliable remote audio URLs; keep silent so scene never blocks.
        playExplosionSound = function () {
          try {
            if (explosionSound.buffer) {
              if (explosionSound.isPlaying) explosionSound.stop();
              explosionSound.play();
            }
          } catch (e) { /* silent */ }
        };
      } catch (e) {
        playExplosionSound = function () {};
      }

      function triggerExplosion(x, z) {
        explosionLight.position.set(x, 3, z);
        explosionLight.intensity = 4;
        for (var ei = 0; ei < 12; ei++) {
          var sx = x + (Math.random() - 0.5) * 4;
          var sz = z + (Math.random() - 0.5) * 4;
          spawnSmoke(sx, 1 + Math.random() * 2, sz);
        }
        playExplosionSound();
      }

      // --- Cinematic follow camera only ---
      var cameraMode = 'behind'; // behind / low_third_person
      function updateCameraFollow() {
        if (cameraMode === 'behind') {
          var offset = new THREE.Vector3(0, 1.6, 3);
          var side = new THREE.Vector3(0.6, 0, 0);
          var targetPos = soldierGroup.position.clone().add(offset).add(side);
          camera.position.lerp(targetPos, 0.1);
          camera.lookAt(soldierGroup.position.clone().add(new THREE.Vector3(0, 1.2, -5)));
        } else if (cameraMode === 'low_third_person') {
          var offset2 = new THREE.Vector3(0, 0.8, 4.5);
          var targetPos2 = soldierGroup.position.clone().add(offset2);
          camera.position.lerp(targetPos2, 0.1);
          camera.lookAt(soldierGroup.position.clone().add(new THREE.Vector3(0, 1.3, -5)));
        }
      }

      // --- 30s timeline ---
      var clock = new THREE.Clock();
      var totalTime = 0;
      var TOTAL = 30;

      function resetSequence() {
        totalTime = 0;
        soldierGroup.position.set(0, 1, 5);
        squad.forEach(function (sg, idx) {
          sg.position.set((idx - 1) * 1.5, 1, 7 + idx * 0.5);
        });
        heliGroup.position.set(-20, 15, -40);
        cameraMode = 'behind';
      }

      function updateTimeline(dt) {
        totalTime += dt;
        if (totalTime > TOTAL) {
          resetSequence();
        }

        // 0-5s: cautious advance
        if (totalTime < 5) {
          soldierGroup.position.z -= dt * 1.5;
          squad.forEach(function (sg, idx) {
            var target = soldierGroup.position.clone().add(new THREE.Vector3((idx - 1) * 1.2, 0, 2 + idx * 0.3));
            sg.position.lerp(target, 0.1);
          });
        }

        // 5-10s: distant explosions
        if (totalTime > 5 && totalTime < 10) {
          if (Math.random() < 0.02) {
            triggerExplosion((Math.random() - 0.5) * 20, -40 - Math.random() * 20);
          }
          soldierGroup.position.z -= dt * 1.2;
          squad.forEach(function (sg, idx) {
            var target = soldierGroup.position.clone().add(new THREE.Vector3((idx - 1) * 1.2, 0, 2 + idx * 0.3));
            sg.position.lerp(target, 0.08);
          });
        }

        // 10-15s: cover at barrier
        if (totalTime > 10 && totalTime < 15) {
          var targetZ = -20 + 1.5;
          soldierGroup.position.z = THREE.MathUtils.lerp(soldierGroup.position.z, targetZ, 0.05);
          soldierGroup.position.x = THREE.MathUtils.lerp(soldierGroup.position.x, -0.5, 0.05);
          squad.forEach(function (sg, idx) {
            var target = soldierGroup.position.clone().add(new THREE.Vector3((idx - 1) * 1.3, 0, 2.2 + idx * 0.4));
            sg.position.lerp(target, 0.08);
          });
        }

        // 15-18s: nearby blasts
        if (totalTime > 15 && totalTime < 18) {
          if (Math.random() < 0.05) {
            triggerExplosion(0 + (Math.random() - 0.5) * 6, -22 + (Math.random() - 0.5) * 4);
          }
        }

        // 18-24s: push forward
        if (totalTime > 18 && totalTime < 24) {
          soldierGroup.position.z -= dt * 2.0;
          squad.forEach(function (sg, idx) {
            var target = soldierGroup.position.clone().add(new THREE.Vector3((idx - 1) * 1.4, 0, 2 + idx * 0.5));
            sg.position.lerp(target, 0.15);
          });
        }

        // 24-28s: heli pass
        if (totalTime > 24 && totalTime < 28) {
          heliGroup.position.x += dt * 8;
          heliGroup.position.z += dt * 3;
          heliGroup.position.y = 12 + Math.sin(totalTime * 2) * 1.5;
          if (Math.random() < 0.1) {
            spawnSmoke(
              heliGroup.position.x + (Math.random() - 0.5) * 4,
              heliGroup.position.y - 5 + (Math.random() - 0.5) * 2,
              heliGroup.position.z + (Math.random() - 0.5) * 4
            );
          }
        }

        // 28-30s: deeper advance
        if (totalTime > 28 && totalTime < 30) {
          soldierGroup.position.z -= dt * 2.5;
          squad.forEach(function (sg, idx) {
            var target = soldierGroup.position.clone().add(new THREE.Vector3((idx - 1) * 1.6, 0, 2 + idx * 0.6));
            sg.position.lerp(target, 0.2);
          });
        }

        // Camera mode switch 12-16s low third person
        if (totalTime > 12 && totalTime < 16) {
          cameraMode = 'low_third_person';
        } else {
          cameraMode = 'behind';
        }
      }

      function updateSmoke(dt) {
        for (var idx = smokeParticles.length - 1; idx >= 0; idx--) {
          var p = smokeParticles[idx];
          p.life += dt;
          if (p.life < 0.2) {
            p.mesh.material.opacity = THREE.MathUtils.lerp(p.mesh.material.opacity, 0.6, 0.2);
          } else {
            p.mesh.material.opacity = THREE.MathUtils.lerp(p.mesh.material.opacity, 0.0, 0.05);
            p.mesh.position.y += dt * 0.5;
          }
          if (p.life > 3) {
            scene.remove(p.mesh);
            smokeParticles.splice(idx, 1);
          }
        }
      }

      function updateExplosionLight() {
        explosionLight.intensity = THREE.MathUtils.lerp(explosionLight.intensity, 0, 0.1);
      }

      function updateCinematicFeel() {
        dirLight.intensity = 1.2 + Math.sin(totalTime * 0.5) * 0.2;
      }

      function animate() {
        requestAnimationFrame(animate);
        var dt = clock.getDelta();
        updateTimeline(dt);
        updateSmoke(dt);
        updateExplosionLight();
        updateCinematicFeel();
        updateCameraFollow();

        // Rotor spin via userData tag (not geometry identity)
        heliGroup.children.forEach(function (child) {
          if (child.userData && child.userData.isRotor) {
            child.rotation.y += dt * 10;
          }
        });

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
