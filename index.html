<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello · damaxuexi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="top">
      <p class="eyebrow">damaxuexi</p>
      <button type="button" id="btn-theme" class="theme" aria-label="切换主题">浅色</button>
    </div>
    <h1 id="greeting">你好，世界</h1>
    <p class="en" id="greeting-en">Hello, world.</p>
    <p class="hint">问候、冷知识，下面还有个射击小游戏。</p>

    <div class="actions">
      <button type="button" id="btn-hello">换一句问候</button>
      <button type="button" id="btn-fact" class="secondary">随机冷知识</button>
    </div>

    <p class="fact" id="fact" hidden></p>
    <p class="counter">你已经点了 <strong id="clicks">0</strong> 次</p>

    <section class="game" aria-label="射击小游戏">
      <div class="game-head">
        <h2>流星射击</h2>
        <p class="game-tip">点击或空格开火 · 打掉下落的球</p>
      </div>
      <div class="hud">
        <span>分数 <strong id="score">0</strong></span>
        <span>生命 <strong id="lives">3</strong></span>
        <span>最高 <strong id="best">0</strong></span>
      </div>
      <canvas id="game" width="520" height="360"></canvas>
      <div class="game-actions">
        <button type="button" id="btn-start">开始 / 重开</button>
        <button type="button" id="btn-pause" class="secondary">暂停</button>
      </div>
      <p class="game-over" id="game-over" hidden>游戏结束 — 再点开始重来</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
